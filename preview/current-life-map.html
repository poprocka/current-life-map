ng information, it may be stored as part of your response. Anonymous by default does not mean that technical information or information you choose to provide can never identify you."]},{title:"2. Information we collect",body:["Depending on how you use the experience, information may include: your Self-Interview answers and optional reflections; the Current Life Map and its interpretations; technical information necessary to operate and secure the service; an email address if you request delivery; and contact, scheduling, and service information if you book coaching. We do not require contact details to complete the Self-Interview."]},{title:"3. Optional PDF delivery",body:["If you choose to receive your Current Life Map by email, we use the email address you provide to deliver the requested report and communicate about that request. The email address and related delivery record may be retained for appropriate service and recordkeeping purposes. Requesting email delivery is optional and is not required to view your results."]},{title:"4. Life Map Deep Dive and coaching",body:["If you book a Life Map Deep Dive from your Current Life Map experience, the contact information you provide during booking may be connected to your Map, answers, and optional reflections. This allows Jana to identify the correct Map, prepare for and provide the session, and maintain appropriate client records. The booking experience must disclose this connection before you confirm your booking. Once associated with an identified client, the Map may form part of that client's service record. Research and methodology analysis should use de-identified information rather than the client's identifying details."]},{title:"5. How information is used",body:["We use information to operate the Self-Interview, calculate and display the Current Life Map, provide requested reports and services, respond to inquiries, maintain security, and improve the assessment and Life Architecture methodology. De-identified assessment responses may be analyzed to refine questions, interpretation logic, assessment versions, and understanding of recurring whole-life patterns. We do not intend to publish responses in a way that identifies an individual. Providing an email for report delivery does not, by itself, enroll you in marketing communications."]},{title:"6. Sensitive topics and your choices",body:["Questions may address health, wellbeing, relationships, sexuality, finances, emotions, identity, and other personal matters. Answer only what you feel comfortable sharing. Optional questions may be skipped where the Self-Interview allows. Please do not include information about other identifiable people unless necessary and appropriate."]},{title:"7. Storage, service providers, and security",body:["Information may be processed by service providers that operate the application, store assessment data, deliver email or PDFs, or support bookings. Access to identifiable client information should be limited to those who need it to provide the service. We use reasonable technical and organizational safeguards, but no online system can guarantee absolute security. Specific providers, storage locations, and international transfers must be disclosed once the production infrastructure is confirmed."]},{title:"8. Retention",body:["De-identified assessment data may be retained for ongoing internal research and methodology improvement. Identifiable contact and client records are retained only for as long as reasonably needed for the relevant service, legal obligations, and legitimate business records. Specific retention periods or criteria will be confirmed before public launch. Where a response remains anonymous and cannot be linked to an individual, it may not be possible to locate or delete that specific response upon request."]},{title:"9. Access, correction, and deletion requests",body:["If we hold information that identifies you, you may contact us to request access, correction, deletion, or other rights available under applicable law. Some requests may be subject to legal exceptions or identity verification. Contact: hello@jasia.design. Because anonymous responses are not necessarily linked to your identity, we may be unable to identify a particular anonymous response after submission."]},{title:"10. Coaching and wellbeing scope",body:["The Current Life Map is a reflective coaching and self-awareness tool. It is not medical, psychological, psychiatric, diagnostic, legal, financial, or emergency care and does not replace qualified professional services. Its interpretations are intended to support reflection, not to establish clinical findings or objective judgments about you."]},{title:"11. Adults",body:["The Current Life Map is intended for adults aged 18 and older."]},{title:"12. Contact",body:["For privacy requests, support, or inquiries, email hello@jasia.design."]}];function Ft(){return t.createElement("main",{className:"mx-auto max-w-[680px] px-6 pb-24 pt-14"},t.createElement(re,{href:"/",className:"eyebrow hover:text-burgundy"},"\u2190 The Current Life Map"),t.createElement("header",{className:"mt-10"},t.createElement("h1",{className:"font-serif text-[40px] font-light leading-tight text-burgundy"},"Current Life Map"),t.createElement("p",{className:"eyebrow mt-3"},"Privacy & Data Use Notice \xB7 October 2026")),t.createElement("p",{className:"mt-10 text-[14.5px] leading-[1.75] text-mahogany/85"},"The Current Life Map is a guided Self-Interview designed to help you see your present life more clearly. This notice explains what information may be collected, how it is used, and the choices available to you."),t.createElement("div",{className:"mt-10 space-y-9"},Wo.map(e=>t.createElement("section",{key:e.title},t.createElement("h2",{className:"font-serif text-[22px] font-normal text-burgundy"},e.title),t.createElement("div",{className:"mt-3 space-y-3 text-[14px] leading-[1.75] text-mahogany/85"},e.body.map(n=>t.createElement("p",{key:n.slice(0,40)},n))
