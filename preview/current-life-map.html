ne and your fuel. The risk isn't the effort; it's that when something feeds us this much, we stop noticing what it takes, until our body or the people close to us notice first.`,"energy.exchange":(e,t)=>`Energy works less like a fixed budget and more like a current: some places draw it out, others bring it back. Your energy may depend on ${t(e.areas[1])} more than you notice, especially when ${t(e.areas[0])} asks a lot.`,"energy.source":(e,t)=>`The places that make us feel most alive are often where we are most ourselves, with nothing to prove. They also tend to be the first thing we cut when life gets busy, which is exactly when we need them most. ${t(e.areas[0])} may be one of yours.`,"energy.meaningful-demand":e=>`We tend to read tiredness as a sign that something is wrong. But what matters is often demanding; the effort is part of why it matters. The more useful question may be whether you're recovering from ${e.areas.length>1?"these areas":"this area"} as deliberately as you're giving to ${e.areas.length>1?"them":"it"}.`,"energy.balance":()=>"Knowing where your energy comes from, and where it goes, is one of the most practical forms of self-knowledge. It lets you protect your energy before demands rise, not after.","energy.source-takes":(e,t)=>`Feeling alive and feeling at ease aren't the same thing. ${t(e.areas[0])} may light you up and wear you out, sometimes in the same week. The things we care about most are rarely the easiest.`,"alignment.priority-gap":()=>"We rarely drift from what matters through one big decision. It usually happens through many small, reasonable ones: next month, once things calm down. Something that still matters to you may be waiting for space you haven't yet been able to give it, and life rarely makes that space on its own.","alignment.expectations":(e,t)=>e.valence==="tension"?`We all carry a version of ourselves shaped to meet other people's expectations: the face we show the world. It's useful, and often kind. But when it starts making the decisions, life can begin to feel slightly borrowed. Some of how you live ${t(e.areas[0])} may be shaped more by others than by you.`:`We all carry a version of ourselves shaped to meet other people's expectations. The question isn't whether others influence you in ${t(e.areas[0])}, but whether you've chosen which influences to keep.`,"alignment.lived-values-low":(e,t)=>`When the way we live drifts from what we value, it rarely feels dramatic. It shows up as a low hum: going through the motions, doing what makes sense rather than what feels true. That hum is information. It may point to the part of ${t(e.areas[0])} that is running on "should", and wants to be more yours.`,"alignment.lived-values-high":()=>"Living by your own values doesn't make life easier, but it does make it feel like yours. That sense of authorship is one of the steadiest foundations a person can have.","alignment.crowded-unimportant":(e,t)=>`Sometimes we rate something as unimportant because it hasn't had room in a while, not because it doesn't matter. ${t(e.areas[0])} may matter more to you than the rating suggests, or the trade-off may genuinely sit well with you.`,"self.strengths":()=>"The relationship with yourself is the one you live in every day; every other relationship is lived through it. These may be the parts of yourself you can rely on when things get harder.","self.quieter":()=>"How we treat ourselves when no one is watching shapes everything else. These may be the places where being on your own side is still being learned, and that learning is possible at any point in life.","self.values-living":(e,t)=>`Insight is the beginning, not the end. Knowing what you want and arranging a life around it are two different acts, and the second usually asks for courage more than clarity. In ${t(e.areas[1])}, what you know may be ahead of what your circumstances currently allow.`,"self.even":()=>"Some of these questions may still be open for you, and an open question can be a more honest place to stand than a quick answer.","emotion.mixed":(e,t)=>`Feelings are signals, not verdicts. ${t(e.areas[0])} may be meaningful and demanding at once, and holding both without rushing to resolve them is a sign of emotional maturity, not confusion.`,"emotion.strained":(e,t)=>`Feelings are signals, not verdicts. ${t(e.areas[0])} may be costing you more than it gives right now, and the feeling may be pointing to a need that isn't being met yet.`,"emotion.alive":(e,t)=>`Feelings are signals, and this one points somewhere good. ${t(e.areas[0])} may be one of the places where you come back to yourself.`,"contrast.feelings-statements":(e,t)=>e.valence==="strength"?`What we feel and what we've built may not match. ${t(e.areas[0])} may feel better in the moment than the routines around it suggest: present in moments, rather than built into your life.`:`What looks fine from the outside can still ask a lot on the inside. ${t(e.areas[0])} may look steady while quietly costing you, and that cost deserves to be taken seriously, even if no one else sees it.`,"link.demand-crowded":(e,t)=>`Every yes is also a no to something else. ${t(e.areas[1])} may be what quietly pays for the demands of ${t(e.areas[0])}. That trade-off may be the right one for now; it's worth making sure it's one you're choosing, not one that's choosing you.`,"link.ambition-restoration":e=>e.valence==="strength"?"Recovery isn't the opposite of ambition; it's what makes ambition last. You may have found a rhythm where the two support each other, and that's rarer than it sounds.":"Many driven people treat rest as a reward for finishing, but the list doesn't end. Rest may feel like something earned once the important things are done, rather than part of how you do them. Recovery isn't the opposite of ambition; it's what makes it sustainable.","link.body-mind":e=>e.valence==="strength"?"Body and mind are less separate than we treat them. Yours may be giving each other a steady base, which makes everything else a little easier.":"Body and mind are less separate than we treat them. Low physical energy and a busy mind may be feeding each other, and a small change in one can sometimes ease the other.","link.career-community":()=>"Achievement and belonging meet different needs. One part of your social world may be carrying the other, but neither can fully stand in for the other for long.","link.permission":()=>"Needing to earn rest or pleasure often grows from a quiet belief that our worth lies in what we produce. Learning to receive, without first justifying it, can be one of the hardest and most freeing things a person does.","link.standards-care":()=>"High standards can be a gift, until they turn inward and make even self-care one more thing to get right. Self-compassion isn't lowering the bar; it's what lets you keep reaching for it without breaking.","link.voice":()=>"Not saying what we need often protects closeness in the short term and wears it down in the long term. Being close to someone asks us to be known, needs included.","link.room-to-grow":()=>"Inner change often runs ahead of outer circumstances. That gap can feel frustrating, but it's also evidence that you've already started moving.","link.familiar":()=>"The mind tends to prefer a known discomfort to an unknown possibility. Courage isn't the absence of that fear; it's taking a small step while you still feel it. Clarity and motivation usually follow action, rather than the other way round.","link.growth-joy":()=>"Growth can quietly become another form of striving. Joy is a reminder that you are not only a project to improve, but a person to enjoy being.","link.leverage":()=>"People often sense where the lever is before they can explain why. A small, steady change in one area can reshape a whole life more than a big push everywhere at once.","link.lever-strong":(e,t)=>`Growth doesn't only come from fixing what's weak; it often comes from building on what's already strong. The next step in ${t(e.areas[0])} may be about going further rather than repairing something.`,"link.overall":e=>e.valence==="tension"?"When areas compete, every choice can feel like it costs something. Seeing the whole picture is what lets you choose the trade-offs, rather than simply absorb them.":"When the parts of a life support each other, effort in one tends to carry into the rest. That's a quiet form of design, whether or not you planned it.","strength.reinforcing":()=>"Strengths rarely work alone. These two may be making each other easier, which is a resource worth knowing you have.","centre.roles":(e,t)=>`When one area becomes the centre of gravity, everything else starts to orbit it, sometimes without us choosing it. Much of your energy may be going into holding ${t(e.areas[0])} steady. That can be exactly what a season requires; it can also quietly become an identity, the role you play. Noticing it is the first step to deciding whether it's still yours to carry this way.`,"pattern.several":()=>"When many things ask for care at once, it's natural to feel scattered, or to feel you should tend to everything. You don't have to. Awareness comes first; then you can choose one place to begin.","pattern.well-supported":()=>"When life is working, it's easy to take it for granted. What you've built may deserve as much care and attention as anything you'd want to change."},Bb="This may reflect this season rather than a lasting pattern.",Lb={"priority.strength":"Support can shift quickly when circumstances change.","support.top":"Areas that look well supported can still have moments of strain.","energy.source":"What restores you now may change as your season changes.","energy.exchange":"The exchange may feel very different from week to week.","alignment.lived-values-high":"Living by your values can still be tiring.","self.strengths":"Strengths can feel less available on harder days.","emotion.alive":"Feelings can change from week to week.","emotion.strained":"These feelings may belong to a passing phase rather than the area itself.","link.leverage":"Improving one area won't necessarily change the others, but your instinct is worth exploring.","strength.reinforcing":"Two strengths can also sit side by side without affecting each other.","centre.roles":"Staying steady may be the wise choice right now, and some circumstances may be outside your control."}});function na(e){let t=new Set;return e.filter(r=>t.has(r.questionId)?!1:(t.add(r.questionId),!0))}function xf(e,t){let r=jb(e.text);return!t||t==="sun"||!e.clause||r.toLowerCase().includes(t.toLowerCase())?r:`${e.clause.charAt(0).toUpperCase()}${e.clause.slice(1)}.`}function wf(e,t){let r=Ce;if(t&&r.includes(t)){let a=t,l=[];e.mostImportant.length===1&&e.mostImportant[0]===a?l.push("is your largest Orbit"):e.important(a)&&l.push("is one of your largest Orbits"),e.lessSupported(a)?l.push("appears dimmer"):e.moreSupported(a)&&l.push("glows brightly");let d=e.by[a].distanceBand,c=r.filter(u=>e.by[u].distanceBand==="far");if(d==="far"?l.push(c.length===1?"sits furthest from the Sun":"sits further from the Sun"):d==="close"&&l.push("sits close to the Sun"),l.length<3&&e.takes(a)?l.push("takes more energy than it gives"):l.length<3&&e.gives(a)&&l.push("gives you energy back"),l.length)return`On your Map, ${e.name(a)} ${Z(l.slice(0,3))}.`}let n=r.filter(e.gives),i=r.filter(e.takes);if(n.length&&i.length)return`On your Map, energy flows in from ${Z(n.map(e.name))} and out toward ${Z(i.map(e.name))}.`;let o=e.mostImportant.slice(0,3);return o.length?`On your Map, ${Z(o.map(e.name))} ${o.length>1?"are the largest Orbits":"is the largest Orbit"}.`:""}function kf(e,t){var a,l;let n=(a=t.free("opening")[0])!=null?a:null;if(!n){let d=e.mostImportant.slice(0,3).map(e.name),c=e.ic.largestSource?e.name(e.ic.largestSource):null,u=["Your answers don't point to one simple story, and that is useful in itself.",d.length?`${Z(d)} ${d.length>1?"are":"is"} what matters most to you right now${c?`, and ${c} is where your energy comes back`:" n of your Current Life Map and the internal uses described below.","Please avoid entering identifying details in open-response fields. If you voluntarily include identifying information, it may be stored as part of your response. Anonymous by default does not mean that technical information or information you choose to provide can never identify you."]},{title:"2. Information we collect",body:["Depending on how you use the experience, information may include: your Self-Interview answers and optional reflections; the Current Life Map and its interpretations; technical information necessary to operate and secure the service; an email address if you request delivery; and contact, scheduling, and service information if you book coaching. We do not require contact details to complete the Self-Interview."]},{title:"3. Optional PDF delivery",body:["If you choose to receive your Current Life Map by email, we use the email address you provide to deliver the requested report and communicate about that request. The email address and related delivery record may be retained for appropriate service and recordkeeping purposes. Requesting email delivery is optional and is not required to view your results."]},{title:"4. Life Map Deep Dive and coaching",body:["If you book a Life Map Deep Dive from your Current Life Map experience, the contact information you provide during booking may be connected to your Map, answers, and optional reflections. This allows Jana to identify the correct Map, prepare for and provide the session, and maintain appropriate client records. The booking experience must disclose this connection before you confirm your booking. Once associated with an identified client, the Map may form part of that client's service record. Research and methodology analysis should use de-identified information rather than the client's identifying details."]},{title:"5. How information is used",body:["We use information to operate the Self-Interview, calculate and display the Current Life Map, provide requested reports and services, respond to inquiries, maintain security, and improve the assessment and Life Architecture methodology. De-identified assessment responses may be analyzed to refine questions, interpretation logic, assessment versions, and understanding of recurring whole-life patterns. We do not intend to publish responses in a way that identifies an individual. Providing an email for report delivery does not, by itself, enroll you in marketing communications."]},{title:"6. Sensitive topics and your choices",body:["Questions may address health, wellbeing, relationships, sexuality, finances, emotions, identity, and other personal matters. Answer only what you feel comfortable sharing. Optional questions may be skipped where the Self-Interview allows. Please do not include information about other identifiable people unless necessary and appropriate."]},{title:"7. Storage, service providers, and security",body:["Information may be processed by service providers that operate the application, store assessment data, deliver email or PDFs, or support bookings. Access to identifiable client information should be limited to those who need it to provide the service. We use reasonable technical and organizational safeguards, but no online system can guarantee absolute security. Specific providers, storage locations, and international transfers must be disclosed once the production infrastructure is confirmed."]},{title:"8. Retention",body:["De-identified assessment data may be retained for ongoing internal research and methodology improvement. Identifiable contact and client records are retained only for as long as reasonably needed for the relevant service, legal obligations, and legitimate business records. Specific retention periods or criteria will be confirmed before public launch. Where a response remains anonymous and cannot be linked to an individual, it may not be possible to locate or delete that specific response upon request."]},{title:"9. Access, correction, and deletion requests",body:["If we hold information that identifies you, you may contact us to request access, correction, deletion, or other rights available under applicable law. Some requests may be subject to legal exceptions or identity verification. Contact: hello@jasia.design. Because anonymous responses are not necessarily linked to your identity, we may be unable to identify a particular anonymous response after submission."]},{title:"10. Coaching and wellbeing scope",body:["The Current Life Map is a reflective coaching and self-awareness tool. It is not medical, psychological, psychiatric, diagnostic, legal, financial, or emergency care and does not replace qualified professional services. Its interpretations are intended to support reflection, not to establish clinical findings or objective judgments about you."]},{title:"11. Adults",body:["The Current Life Map is intended for adults aged 18 and older."]},{title:"12. Contact",body:["For privacy requests, support, or inquiries, email hello@jasia.design."]}];function Gc(){return s.createElement("main",{className:"mx-auto max-w-[680px] px-6 pb-24 pt-14"},s.createElement(nt,{href:"/",className:"eyebrow hover:text-burgundy"},"\u2190 The Current Life Map"),s.createElement("header",{className:"mt-10"},s.createElement("h1",{className:"font-serif text-[40px] font-light leading-tight text-burgundy"},"Current Life Map"),s.createElement("p",{className:"eyebrow mt-3"},"Privacy & Data Use Notice \xB7 October 2026")),s.createElement("p",{className:"mt-10 text-[14.5px] leading-[1.75] text-mahogany/85"},"The Current Life Map is a guided Self-Interview designed to help you see your present life more clearly. This notice explains what information may be collected, how it is used, and the choices available to you."),s.createElement("div",{className:"mt-10 space-y-9"},ax.map(e=>s.createElement("section",{key:e.title},s.createElement("h2",{className:"font-serif text-[22px] font-normal text-b
